name: Rust Manual Test -> Build -> Artifact

on:
  workflow_dispatch:

jobs:
  test:
    name: Cargo Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Run tests
        working-directory: app
        run: cargo test --all --verbose

  build:
    name: Cargo Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Build project
        working-directory: app
        run: cargo build --release --all --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-artifacts
          path: |
            app/target/release/
          if-no-files-found: error
